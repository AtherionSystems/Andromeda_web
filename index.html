<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preload" as="image" href="/Andromeda_web/Media/Animations/RedGearGIF.gif" />
  <link rel="preload" as="image" href="/Andromeda_web/Media/Icons/visibility.svg" />
  <link rel="preload" as="image" href="/Andromeda_web/Media/Icons/visibilityWhite.svg" />
  <link rel="preload" as="image" href="/Andromeda_web/Media/Icons/visibilityRed.svg" />
  <link rel="preload" as="image" href="/Andromeda_web/Media/Icons/visibilityOffred.svg" />
  <title>andromeda-web</title>
  <script>
    (() => {
      try {
        const storedTheme = localStorage.getItem('andromeda_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const darkMode = storedTheme ? storedTheme === 'dark' : prefersDark;
        document.documentElement.classList.toggle('dark', darkMode);
        document.documentElement.style.colorScheme = darkMode ? 'dark' : 'light';
      } catch {}
    })();
  </script>
  <script>
    (function() {
      var redirect = sessionStorage.getItem('spa_redirect');
      if (redirect) {
        sessionStorage.removeItem('spa_redirect');
        window.history.replaceState(null, null, '/Andromeda_web' + redirect);
      }
    })();
  </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
