<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script>
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 2).join('/') +
            '/?p=' + encodeURIComponent(l.pathname.slice(l.pathname.indexOf('/', 1) + 1) + l.search + l.hash)
        );
    </script>
</head>
<body></body>
</html>
